<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>User Info - Google Contacts</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 0;
            background: transparent;
            perspective: 1000px;
        }

        .user-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            transform: rotateX(10deg) scale(0.95);
        }

        .user-card:hover {
            transform: rotateX(0) scale(1);
            box-shadow: 0 20px 40px rgba(50, 50, 93, 0.15), 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.2);
            transition: all 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .user-details h3 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .user-details p {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            gap: 8px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            border: 2px solid transparent;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: 2px solid transparent;
        }

        .btn-secondary:hover {
            background-color: #545b62;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }

        .btn i {
            margin-right: 8px;
        }
    </style>

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="/contacts">Contacts</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/user-info">Profile</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="user-card">
        <img th:if="${pictureUrl}" th:src="${pictureUrl}" class="profile-image" alt="Profile picture">
        <div class="user-details">
            <h3>Welcome, <span th:text="${name}">User</span>!</h3>
            <p>Email: <span th:text="${email}">email@example.com</span></p>
        </div>

        <div class="nav-buttons">
            <a href="/contacts" class="btn btn-primary">
                <i class="bi bi-people-fill"></i>View Contacts
            </a>
            <a href="/logout" class="btn btn-secondary">
                <i class="bi bi-box-arrow-right"></i>Logout
            </a>
        </div>
    </div>
</div>

</body>
</html>
