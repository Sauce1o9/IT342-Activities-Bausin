<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Contacts - Google Contacts Integration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f4f6f9;
            --card-background: white;
            --text-color-dark: #2c3e50;
            --text-color-light: #7f8c8d;
        }

        body {
            background-color: var(--background-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: var(--text-color-dark);
        }

        .container {
            max-width: 1200px;
            padding: 30px 15px;
        }

        .contacts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--card-background);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(50, 50, 93, 0.1);
            transition: all 0.3s ease;
        }

        .contacts-header:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.15);
        }

        .contacts-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .btn-add-contact {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-add-contact:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0, 123, 255, 0.4);
        }

        .btn-add-contact i {
            font-size: 18px;
        }

        .contacts-table-container {
            background: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(50, 50, 93, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .contacts-table-container:hover {
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.15);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background-color: var(--primary-color);
            color: white;
        }

        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }

        .table tbody tr {
            transition: background-color 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: rgba(0, 123, 255, 0.05);
        }

        .btn-group-sm .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-group-sm .btn i {
            margin-right: 4px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #a71d2a;
            border-color: #a71d2a;
        }

        .alert-info {
            background-color: rgba(0, 123, 255, 0.1);
            border: none;
            color: var(--primary-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
        }

        .alert-info i {
            font-size: 24px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="/contacts">Contacts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/user-info">Profile</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="contacts-header">
        <h1>Google Contacts</h1>
        <a href="/contact/add-form" class="btn-add-contact">
            <i class="bi bi-plus-circle"></i> Add New Contact
        </a>
    </div>

    <div class="alert alert-info" th:if="${contacts == null || contacts.isEmpty()}">
        <i class="bi bi-info-circle"></i> You don't have any contacts yet. Click "Add New Contact" to create one.
    </div>

    <div class="contacts-table-container" th:unless="${contacts == null || contacts.isEmpty()}">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contact : ${contacts}" class="align-middle">
                <td th:text="${not #lists.isEmpty(contact.names) ? contact.names[0].displayName : 'N/A'}"></td>
                <td th:text="${not #lists.isEmpty(contact.emailAddresses) ? contact.emailAddresses[0].value : 'N/A'}"></td>
                <td th:text="${not #lists.isEmpty(contact.phoneNumbers) ? contact.phoneNumbers[0].value : 'N/A'}"></td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <a th:href="@{'/contacts/edit/' + ${contact.resourceName}}" class="btn btn-primary">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a th:href="@{'/contacts/delete/' + ${contact.resourceName}}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this contact?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
</body>
</html>
